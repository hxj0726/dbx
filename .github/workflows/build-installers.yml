# Build DBX installers in your own fork — no repository secrets required.
#
# How to use:
#   1. Commit this file to the default branch of your fork.
#   2. Open the "Actions" tab and enable workflows for the fork if GitHub asks.
#   3. Pick "Build installers" → "Run workflow":
#        platform      which installer to build
#        npm_packages  also build the CLI/MCP npm tarballs for that platform
#        bundles       optional bundle-format override, e.g. "deb,appimage"
#   4. Download from the run's "Artifacts" section.
#
# Pushing a tag like `app-v0.6.61` builds every platform (plus npm tarballs) and
# attaches the files to a GitHub Release. The `app-v*` prefix is deliberate: the
# upstream `release.yml` reacts to `v*` and needs secrets your fork does not have.
name: Build installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-intel
          - windows-x64
          - linux-x64
      npm_packages:
        description: Also build the CLI/MCP npm tarballs (adds ~15-30 min)
        type: boolean
        default: false
      bundles:
        description: Bundle formats override, e.g. "deb" or "deb,appimage" (empty = platform default)
        type: string
        default: ""
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  # The upstream release profile enables LTO with codegen-units=1, which roughly
  # doubles build time. A personal build does not need that last few percent;
  # drop these two lines if you want a build identical to the official release.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  plan:
    name: Choose build targets
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - id: legs
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          # Linux defaults to "deb" only: plain AppImage bundling on CI hits the
          # linuxdeploy/WebKit library issues the upstream release works around
          # with .github/scripts/prepare-appimage-bundler.sh. Pass the "bundles"
          # input (e.g. deb,appimage) to try it anyway.
          all='[{"name":"macos-arm64","os":"macos-latest","bundles":"dmg","cli":"cli-darwin-arm64","mcp":"mcp-darwin-arm64","exe":""},
                {"name":"macos-intel","os":"macos-15-intel","bundles":"dmg","cli":"cli-darwin-x64","mcp":"mcp-darwin-x64","exe":""},
                {"name":"windows-x64","os":"windows-latest","bundles":"nsis","cli":"cli-win32-x64","mcp":"mcp-win32-x64","exe":".exe"},
                {"name":"linux-x64","os":"ubuntu-22.04","bundles":"deb","cli":"cli-linux-x64-gnu","mcp":"mcp-linux-x64-gnu","exe":""}]'
          case "${PLATFORM:-all}" in
            all)         legs="$all" ;;
            macos-arm64) legs='[{"name":"macos-arm64","os":"macos-latest","bundles":"dmg","cli":"cli-darwin-arm64","mcp":"mcp-darwin-arm64","exe":""}]' ;;
            macos-intel) legs='[{"name":"macos-intel","os":"macos-15-intel","bundles":"dmg","cli":"cli-darwin-x64","mcp":"mcp-darwin-x64","exe":""}]' ;;
            windows-x64) legs='[{"name":"windows-x64","os":"windows-latest","bundles":"nsis","cli":"cli-win32-x64","mcp":"mcp-win32-x64","exe":".exe"}]' ;;
            linux-x64)   legs='[{"name":"linux-x64","os":"ubuntu-22.04","bundles":"deb","cli":"cli-linux-x64-gnu","mcp":"mcp-linux-x64-gnu","exe":""}]' ;;
            *)           echo "unknown platform: $PLATFORM" >&2; exit 1 ;;
          esac
          # The JSON spans several lines, so use the heredoc output form.
          {
            echo "legs<<LEGS_EOF"
            echo "$legs"
            echo "LEGS_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundles
        shell: bash
        run: |
          # `createUpdaterArtifacts: true` in src-tauri/tauri.conf.json makes the
          # bundler sign update packages, which requires TAURI_SIGNING_PRIVATE_KEY.
          # A fork build has no such key, so switch updater artifacts off instead
          # of adding a secret.
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > tauri.ci.conf.json
          pnpm tauri build \
            --bundles "${{ inputs.bundles || matrix.bundles }}" \
            --config ./tauri.ci.conf.json

      # Builds the two Rust binaries the npm packages shell out to, then copies
      # them into the platform package folders before `npm pack` picks them up.
      # Flags match .github/workflows/mcp-release.yml, minus cargo-zigbuild: a
      # native build keeps the runner's own glibc baseline, which is fine for a
      # personal build. No `--target`, so this reuses the artefacts the Tauri
      # build just produced instead of recompiling the workspace.
      - name: Build CLI and MCP binaries
        if: inputs.npm_packages == true || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p "packages/${{ matrix.cli }}/bin" "packages/${{ matrix.mcp }}/bin"

          # `dbx-cli` also emits `target/release/dbx`, the same path the desktop
          # build used, so copy it before anything else runs.
          cargo build --locked --release -p dbx-cli --no-default-features --features dbx-mcp/os-keyring
          cp "target/release/dbx${{ matrix.exe }}" "packages/${{ matrix.cli }}/bin/dbx${{ matrix.exe }}"

          cargo build --locked --release -p dbx-mcp --features os-keyring
          cp "target/release/dbx-mcp${{ matrix.exe }}" "packages/${{ matrix.mcp }}/bin/dbx-mcp${{ matrix.exe }}"

          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "packages/${{ matrix.cli }}/bin/dbx" "packages/${{ matrix.mcp }}/bin/dbx-mcp"
          fi

      - name: Pack npm tarballs
        if: inputs.npm_packages == true || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p npm-tarballs
          # Each platform ships a binary package plus the wrapper that resolves
          # it at runtime, so both have to be installed together.
          for dir in "packages/${{ matrix.cli }}" "packages/${{ matrix.mcp }}" packages/cli packages/mcp-server; do
            npm pack "$dir" --pack-destination ./npm-tarballs
          done
          ls -1 npm-tarballs

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: dbx-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            npm-tarballs/*.tgz

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
