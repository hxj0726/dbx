name: dbx-web build

# 手动触发。产物按官方发布包的命名与目录结构生成：
#   DBX_<version>_x64-browser-static.tar.gz
#   DBX_<version>_x64-browser-static.tar.gz.sha256
# 解压后是同名目录 dbx-linux-x64-browser-static/，内含 bin/dbx-web-bin、
# dbx 启动脚本、dbx-web 软链和 README.txt。
#
# 构建参数与 .github/workflows/release.yml 的 static-browser 任务逐项对齐：
# 同一个 musl target、同一组 features、同一个打包脚本，所以两个流程产出的包可以互换。
#
# 用法：Actions → "dbx-web build" → Run workflow → 下载对应 artifact。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "覆盖版本号（留空则读 crates/dbx-web 的 Cargo 版本）"
        type: string
        default: ""

concurrency:
  group: dbx-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      # 官方 x64 就用这一条；静态链 musl 后再用 readelf 校验没有解释器。
      RUSTFLAGS: "-C target-feature=+crt-static"
      DBX_STATIC_TARGET: x86_64-unknown-linux-musl
      DBX_ARCH: x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.DBX_STATIC_TARGET }}

      # 这个 pip 包同时带来 cargo-zigbuild 子命令和它依赖的 zig，
      # 因此不需要额外的 zig 安装步骤（官方 release 也只是这一步）。
      - name: Install cargo-zigbuild
        run: pip3 install cargo-zigbuild

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: static-browser-x64
          cache-on-failure: true

      # rust-embed 读仓库根的 dist/（crates/dbx-web 里是 #[folder = "../../dist"]），
      # vite 的 outDir 正是 ../../dist，所以必须先构建前端。
      - name: Build frontend
        run: pnpm build

      - name: Build static web binary
        run: |
          cargo zigbuild --release -p dbx-web --target "$DBX_STATIC_TARGET" \
            --no-default-features --features "embed-static,duckdb-sidecar,dynamodb,mq-admin,dbx-core/sqlite-bundled"

      - name: Package static browser runtime
        run: |
          chmod +x scripts/package-web-static.sh
          ./scripts/package-web-static.sh

      - name: Rename to official asset naming
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "dbx-web") | .version')"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "无法确定 dbx-web 版本号" >&2
            exit 1
          fi
          SOURCE="dist-web-static/dbx-linux-${DBX_ARCH}-browser-static.tar.gz"
          ASSET="DBX_${VERSION}_${DBX_ARCH}-browser-static.tar.gz"
          cp "$SOURCE" "$ASSET"
          sha256sum "$ASSET" | tee "${ASSET}.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=dbx-linux-${DBX_ARCH}-browser-static" >> "$GITHUB_ENV"

      - name: Verify package layout
        run: |
          # 顶层目录名必须与官方一致，且启动脚本能打印帮助
          tar -tzf "$ASSET" > /tmp/layout.txt
          head -n 10 /tmp/layout.txt
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar -C /tmp/smoke -xzf "$ASSET"
          test -d "/tmp/smoke/$PACKAGE_DIR" || { echo "顶层目录不是 $PACKAGE_DIR" >&2; exit 1; }
          "/tmp/smoke/$PACKAGE_DIR/dbx" --help
          file "/tmp/smoke/$PACKAGE_DIR/bin/dbx-web-bin"

      - uses: actions/upload-artifact@v4
        with:
          name: DBX-browser-static-${{ env.DBX_ARCH }}
          path: |
            DBX_*_${{ env.DBX_ARCH }}-browser-static.tar.gz
            DBX_*_${{ env.DBX_ARCH }}-browser-static.tar.gz.sha256
          retention-days: 14
